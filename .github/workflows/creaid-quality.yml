name: CreAid quality gate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Install isolated browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 pixelmatch@7.1.0 pngjs@7.0.0
          npx playwright install --with-deps chromium firefox webkit
      - name: Prepare and verify canonical Apache configuration
        run: node .github/scripts/prepare-ionos.mjs
      - name: Start candidate
        run: |
          node scripts/preview.mjs > "$RUNNER_TEMP/creaid-preview.log" 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/ >/dev/null
      - run: npm run test:routes -- http://127.0.0.1:8080
      - name: Browser matrix and representative screenshots
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creaid-quality-results
          path: qa-results/
          if-no-files-found: warn
          retention-days: 14
