name: CreAid quality gate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Install isolated browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1 pixelmatch@7.1.0 pngjs@7.0.0
          npx playwright install --with-deps chromium firefox webkit
      - name: Start candidate and immutable baseline
        run: |
          git worktree add --detach "$RUNNER_TEMP/creaid-baseline" 335c4c27fa7b50af10e095c5e8db0d69c4d457b8
          node scripts/preview.mjs > "$RUNNER_TEMP/creaid-preview.log" 2>&1 &
          (cd "$RUNNER_TEMP/creaid-baseline" && CREAID_PREVIEW_PORT=8081 node scripts/preview.mjs > "$RUNNER_TEMP/creaid-baseline.log" 2>&1) &
          for port in 8080 8081; do
            for attempt in {1..30}; do
              if curl -fsS "http://127.0.0.1:$port/" >/dev/null; then break; fi
              sleep 1
            done
            curl -fsS "http://127.0.0.1:$port/" >/dev/null
          done
      - run: npm run test:routes -- http://127.0.0.1:8080
      - name: Browser matrix and reference comparison
        env:
          CREAID_QA_BASELINE: http://127.0.0.1:8081
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creaid-quality-results
          path: qa-results/
          if-no-files-found: warn
          retention-days: 14
