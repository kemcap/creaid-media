name: Performance Engine QA (no deployment)
on:
  pull_request:
    paths:
      - 'scripts/performance/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/performance-engine-qa.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:performance
      - name: Install Apache HTTP test server
        run: |
          if ! test -f /usr/lib/apache2/modules/mod_brotli.so; then
            sudo apt-get update
            sudo apt-get install -y apache2
          fi
      - run: node scripts/performance/test-apache-http.mjs
      - name: Install isolated optional optimization tools
        run: npm install --prefix "$RUNNER_TEMP/creaid-opt-tools" --save-exact --no-audit --no-fund esbuild@0.25.12 sharp@0.34.1
      - run: node scripts/performance/test-optimize-input.mjs "$RUNNER_TEMP/creaid-opt-tools"
      - run: node scripts/performance/test-responsive-images.mjs "$RUNNER_TEMP/creaid-opt-tools"
      - run: node scripts/performance/test-compare-lighthouse.mjs
      - run: npm run verify
      - run: npm run performance:preview -- dist performance-preview
      - run: npm run performance:audit -- dist performance-audit
      # Reports contain internal paths; keep them in the runner, not public artifacts.
