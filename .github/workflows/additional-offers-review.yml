name: Internal additional offers review (no deployment)
on:
  push:
    branches: [optimization/additional-offers]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/render-additional-offers-review.mjs
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node scripts/check-additional-offers-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: additional-offers-review
          path: qa-results/
          retention-days: 14
