name: Compare deployed GitHub and IONOS previews
on:
  push:
    branches: [main]
    paths: ['.github/workflows/compare-live-previews.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  deployments: read
concurrency:
  group: preview-reference-audit
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identify actual successful Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-pages.yml/runs?status=success&per_page=15" --jq '.workflow_runs[] | {id,head_sha,head_branch,created_at,updated_at,html_url}' | tee "$RUNNER_TEMP/pages-runs.jsonl"
          gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=20" > "$RUNNER_TEMP/deployments.json"
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          for d in json.loads((root/'deployments.json').read_text()):
              statuses=json.loads(subprocess.check_output(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/deployments/{d['id']}/statuses"],text=True))
              print(json.dumps({'id':d['id'],'sha':d['sha'],'ref':d['ref'],'created_at':d['created_at'],'latest_status':statuses[0] if statuses else None},ensure_ascii=False))
              if statuses and statuses[0]['state']=='success':
                  (root/'pages-sha').write_text(d['sha'])
                  break
          if not (root/'pages-sha').exists():
              raise SystemExit('No currently successful Pages deployment could be verified; do not guess.')
          PY
      - name: Compare live content and asset hashes
        run: |
          python3 - <<'PY'
          import concurrent.futures,hashlib,html,json,os,re,subprocess,urllib.request,urllib.error
          from pathlib import Path
          from html.parser import HTMLParser
          root=Path(os.environ['RUNNER_TEMP'])
          sha=(root/'pages-sha').read_text().strip()
          routes=json.loads(subprocess.check_output(['git','show',sha+':src/_data/routes.json'],text=True))
          print('VERIFIED_PAGES_DEPLOYMENT_SHA='+sha)
          print('CANONICAL_ROUTES='+str(len(routes)))
          pages='https://kemcap.github.io/creaid-media'
          ionos='https://vorschau.creaid-media.de'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'CreAid-Media preview verification','Cache-Control':'no-cache','Accept-Encoding':'identity'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as response:
                      data=response.read()
                      return {'status':response.status,'url':response.geturl(),'type':response.headers.get('Content-Type'),'size':len(data),'sha256':hashlib.sha256(data).hexdigest()},data
              except Exception as e: return {'error':str(e)},b''
          def normalized(data):
              s=data.decode('utf-8','replace').replace('/creaid-media/','/')
              s=re.sub(r'https://kemcap\.github\.io(?=/)','https://creaid-media.de',s)
              return s
          class Extract(HTMLParser):
              def __init__(self):super().__init__();self.assets=set();self.headings=[];self.current=None
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag in ('h1','h2','h3'): self.current=[tag,'']
                  for k in ('src','href','poster','data-src'):
                      v=a.get(k,'')
                      if v.startswith('/assets/'):self.assets.add(v.split('?')[0].split('#')[0])
              def handle_data(self,s):
                  if self.current:self.current[1]+=s
              def handle_endtag(self,tag):
                  if self.current and self.current[0]==tag:
                      self.headings.append((tag,' '.join(self.current[1].split())));self.current=None
          def check(pair):
              k,path=pair
              g,gb=get(pages+path+('' if path.endswith('/') else '/'))
              i,ib=get(ionos+path)
              ga,ia=Extract(),Extract();ga.feed(normalized(gb));ia.feed(normalized(ib))
              return {'route':path,'github':g,'ionos':i,'headings_equal':ga.headings==ia.headings,'github_headings':ga.headings,'ionos_headings':ia.headings,'github_assets':sorted(ga.assets),'ionos_assets':sorted(ia.assets)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex: results=list(ex.map(check,routes.items()))
          assets=sorted({a for r in results for a in r['github_assets']+r['ionos_assets']})
          def asset(a):
              g,_=get(pages+a);i,_=get(ionos+a)
              return {'asset':a,'github':g,'ionos':i,'equal':bool(g.get('sha256')) and g.get('sha256')==i.get('sha256')}
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex: ar=list(ex.map(asset,assets))
          summary={'pages_sha':sha,'routes':len(results),'github_http_failures':[r['route'] for r in results if r['github'].get('status')!=200],'ionos_http_failures':[r['route'] for r in results if r['ionos'].get('status')!=200],'heading_differences':[r['route'] for r in results if not r['headings_equal']],'asset_count':len(ar),'different_assets':[r for r in ar if not r['equal']]}
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          Path('preview-reference-audit.json').write_text(json.dumps({'summary':summary,'routes':results,'assets':ar},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-reference-audit
          path: preview-reference-audit.json
          if-no-files-found: warn
