name: IONOS - Website hochladen (Produktion)
on:
  workflow_dispatch:
    inputs:
      preview_cache:
        description: "Normaler Upload / Vorschau-Cache aktivieren / deaktivieren"
        type: choice
        options: [normal, enabled, disabled]
        default: normal
        required: true
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - '!scripts/performance/**'
      - 'eleventy.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ionos-deploy.yml'
      - '.github/scripts/incremental-ionos.py'
      - '.github/scripts/upload-ionos.py'
      - '.github/scripts/test-incremental-ionos.py'
      - '.github/scripts/prepare-ionos.mjs'
      - '.github/scripts/prepare-production-indexing.mjs'
      - 'docs/sitemap-kandidat-nach-freigabe.xml'
permissions:
  contents: read
concurrency:
  group: ionos-preview-deployment
  cancel-in-progress: false
jobs:
  deploy:
    # Main is the approved preview branch; verification must pass before SFTP upload.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/ionos-deploy.yml
      - name: Install cached preview dependencies and test uploader
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0 paramiko==3.5.1
          python -m py_compile .github/scripts/incremental-ionos.py .github/scripts/upload-ionos.py
          python .github/scripts/test-incremental-ionos.py
      - name: Apply the same image optimization as GitHub Pages
        run: python scripts/optimize-preview-images.py
      - name: Check canonical routes
        run: |
          node scripts/preview.mjs > "$RUNNER_TEMP/preview.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 1
          done
          npm run test:routes -- http://127.0.0.1:8080
      - name: Prepare protected preview and Apache routing
        run: node .github/scripts/prepare-ionos.mjs
      - name: Prepare isolated candidate to preserve the active preview cache mode
        run: |
          node scripts/performance/test-prepare-candidate.mjs
          node .github/scripts/prepare-preview-cache.mjs
      - name: Set production index policy and sitemap (IONOS only)
        run: node .github/scripts/prepare-production-indexing.mjs
      - name: Confirm main has the same preview sources
        run: |
          git fetch --no-tags origin main
          git diff --exit-code "$GITHUB_SHA" FETCH_HEAD -- . ':(exclude)dist'
      - name: Install PHP for the private contact update
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[ionos-preview-contact-core]')
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring
          coverage: none
      - name: Verify the private contact update without delivery
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[ionos-preview-contact-core]')
        run: |
          php -l backend/contact/core.php
          php backend/contact/test.php
          php backend/contact/test-turnstile.php
          php backend/contact/test-hubspot.php
          python -m py_compile .github/scripts/update-preview-contact-core.py
      - name: Incremental deployment to dedicated IONOS production directory
        id: static_preview
        env:
          CREAID_IONOS_PRODUCTION: '1'
          CREAID_PREVIEW_CACHE_MODE: ${{ inputs.preview_cache || 'normal' }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: python .github/scripts/upload-ionos.py
      - name: Update the private contact core on IONOS preview
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[ionos-preview-contact-core]')
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: python .github/scripts/update-preview-contact-core.py
      - name: Activate and verify cache on IONOS preview
        if: ${{ false }}
        env:
          CREAID_PREVIEW_CACHE_MODE: enabled
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: python .github/scripts/upload-ionos.py
