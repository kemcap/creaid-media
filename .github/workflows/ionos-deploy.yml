name: IONOS - Website hochladen (Vorschau)
on:
  workflow_dispatch:
    inputs:
      preview_cache:
        description: "Auto: Build mit Cache / normal: ohne Cache / Cache umschalten"
        type: choice
        options: [auto, normal, enabled, disabled]
        default: auto
        required: true
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - '!scripts/performance/**'
      - 'eleventy.config.js'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
concurrency:
  group: ionos-preview-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.IONOS_AUTO_DEPLOY != 'false')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CREAID_PREVIEW_CACHE_MODE: ${{ (inputs.preview_cache == 'normal' || inputs.preview_cache == 'enabled' || inputs.preview_cache == 'disabled') && inputs.preview_cache || (vars.IONOS_PREVIEW_CACHE == 'disabled' && 'normal' || 'auto') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply the same image optimization as GitHub Pages
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python scripts/optimize-preview-images.py
      - name: Check canonical routes
        run: |
          node scripts/preview.mjs > "$RUNNER_TEMP/preview.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 1
          done
          npm run test:routes -- http://127.0.0.1:8080
      - name: Prepare protected preview and Apache routing
        run: node .github/scripts/prepare-ionos.mjs
      - name: Prepare isolated cache-only candidate
        if: env.CREAID_PREVIEW_CACHE_MODE != 'normal'
        run: |
          node scripts/performance/test-prepare-candidate.mjs
          node .github/scripts/prepare-preview-cache.mjs
          python .github/scripts/test_preview_cache_activation.py
          python .github/scripts/test_publish_cached_preview.py
      - name: Validate candidate browser rendering against current unmodified build
        if: env.CREAID_PREVIEW_CACHE_MODE == 'auto'
        run: bash .github/scripts/test-cache-browser.sh
      - name: Ensure this is still the latest main revision
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Install SFTP client
        run: |
          if ! /usr/bin/python3 -c 'import paramiko'; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends python3-paramiko
          fi
      - name: Upload only to dedicated IONOS preview directory
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: /usr/bin/python3 .github/scripts/upload-ionos.py
