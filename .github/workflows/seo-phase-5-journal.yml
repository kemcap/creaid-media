name: SEO phase 5 journal inventory
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/audit-journal-v23.py'
      - 'docs/seo/phase-5/**'
      - '.github/workflows/seo-phase-5-journal.yml'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run verify
      - name: Render all journal pages and archive inventories
        run: python scripts/audit-journal-v23.py --output seo-phase5-report/candidate.json
      - name: Build immutable previous release for comparison
        env:
          BASELINE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          [[ "$BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git worktree add --detach "$RUNNER_TEMP/journal-baseline" "$BASELINE_SHA"
          (cd "$RUNNER_TEMP/journal-baseline" && npm ci && npm run build)
          python scripts/audit-journal-v23.py --dist "$RUNNER_TEMP/journal-baseline/dist" --output seo-phase5-report/baseline.json
      - name: Verify unchanged draft sources, URLs, assets and publication state
        env:
          BASELINE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --exit-code "$BASELINE_SHA" -- src/_data/routes.json src/_data/aliases.json src/_data/wordpressPreviewDrafts.json src/_data/headingPlan.json docs/sitemap-kandidat-nach-freigabe.xml .github/scripts/prepare-production-indexing.mjs
          python - <<'PY'
          import json
          from pathlib import Path
          a,b=[json.loads(Path('seo-phase5-report/'+x+'.json').read_text()) for x in ('baseline','candidate')]
          for x,y in zip(a['articles'],b['articles']):
              assert x['key']==y['key'] and x['draftLabelRendered']==y['draftLabelRendered']
              assert x['source']==y['source']
              assert x['schemaTypes']==y['schemaTypes']
          for x,y in zip(a['archives'],b['archives']):
              assert x['key']==y['key'] and x['cards']==y['cards']
          pages=json.loads(Path('src/_data/pages.json').read_text())
          posts=json.loads(Path('src/_data/postsIndex.json').read_text())
          for p in posts:
              m=pages[p['slug']]
              path=p['image']
              if m['shareImage']=='https://creaid-media.de'+path:
                  assert (Path('dist')/path.lstrip('/')).is_file(),path
              if m.get('structuredData'):
                  assert json.loads(m['structuredData'])['image']==m['shareImage']
          print('All release-scope and existing media path checks passed. Editorial and image approval remains OPEN.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-phase5-journal-inventory
          path: seo-phase5-report/
          retention-days: 30
