name: Build & verify CreAid-Media preview

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'eleventy.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Eleventy site
        run: npm run build
      - name: Check global header, footer and routes
        run: node scripts/check-global-shell.mjs
      - name: Check homepage animations, mask and accessibility fallbacks
        run: |
          node --check public/assets/home-motion-v5.js
          node scripts/check-home-motion.mjs
      - name: Check hero centering, ticker, pointer and adaptive motion
        run: |
          node --check public/assets/adaptive-scroll.js
          node --check public/assets/home-motion-v5.js
          node --check public/assets/agency-pages.js
          node --check public/assets/specialty-pages.js
          node --check public/assets/journal.js
          node --check public/assets/motion-v4.js
          node --check public/assets/scrollstory.js
          node scripts/check-hero-experience.mjs
      - name: Update prebuilt local preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "Compiled preview is already current"
          else
            git commit -m "Build CreAid preview with global header and footer"
            git push origin HEAD:main
          fi
