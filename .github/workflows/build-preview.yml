name: Build & verify CreAid-Media preview

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'eleventy.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Eleventy site
        run: npm run build
      - name: Setup Python for preview image optimization
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Optimize preview images
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python scripts/optimize-preview-images.py
      - name: Verify V10.3 structure, links and local assets
        run: |
          npm run test:structure
          npm run test:quality
          node .github/scripts/prepare-ionos.mjs
      - name: Update prebuilt local preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "Compiled preview is already current"
          else
            git commit -m "Build CreAid preview with global header and footer"
            git push origin HEAD:main
          fi
