name: Single live browser contact send
on:
  push:
    branches: [main]
    paths: ['.github/workflows/test-live-contact-send.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ionos-preview-deployment
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-live-contact-send.mjs
