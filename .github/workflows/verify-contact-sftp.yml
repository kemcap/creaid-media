name: Verify private contact SFTP access
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-contact-sftp.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ionos-preview-deployment
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install SFTP client
        run: |
          if ! /usr/bin/python3 -c 'import paramiko'; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends python3-paramiko
          fi
      - name: Validate scripts
        run: python3 -m py_compile .github/scripts/upload-ionos.py .github/scripts/clean-upload-ionos.py .github/scripts/install-contact-endpoint.py .github/scripts/verify-contact-sftp.py
      - name: Read-only private access verification
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
        run: /usr/bin/python3 .github/scripts/verify-contact-sftp.py
