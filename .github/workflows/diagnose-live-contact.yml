name: Diagnose deployed contact form
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-live-contact.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/diagnose-live-contact.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-contact-diagnostics
          path: contact-live-*.png
          if-no-files-found: ignore
