name: Deploy CreAid-Media preview to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'eleventy.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: creaid-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Eleventy
        run: npm run build
      - name: Verify global layout and motion
        run: |
          node scripts/check-global-shell.mjs
          node scripts/check-home-motion.mjs
          node scripts/check-hero-experience.mjs
      - name: Prepare GitHub Pages project-site paths and clean URLs
        run: node scripts/prepare-pages.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # Give the GitHub Actions artifact index time to expose the fresh upload.
      # Rerunning the same job would create duplicate github-pages artifacts.
      - name: Wait for uploaded artifact registration
        run: sleep 20
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
