name: Record IONOS reference synchronization status
on:
  push:
    branches: [main]
    paths: ['.github/workflows/observe-ionos-reference.yml']
  workflow_run:
    workflows: ['Synchronize approved GitHub Pages reference to IONOS', 'Compare live preview rendering']
    types: [in_progress, completed]
permissions:
  actions: read
  statuses: write
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Record actual synchronization workflow state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            run=$(jq -er '.workflow_run.id' "$GITHUB_EVENT_PATH")
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" | jq -c . > runs.jsonl
          else
            for file in sync-pages-to-ionos.yml live-visual-compare.yml; do
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$file/runs?per_page=1" | jq -c '.workflow_runs[]' >> runs.jsonl
            done
          fi
          while IFS= read -r row; do
            echo "$row" | jq '{id,name,head_sha,status,conclusion,html_url}'
            sha=$(echo "$row" | jq -er '.head_sha')
            url=$(echo "$row" | jq -er '.html_url')
            status=$(echo "$row" | jq -er '.status')
            conclusion=$(echo "$row" | jq -r '.conclusion')
            name=$(echo "$row" | jq -r '.name')
            context=ionos/reference-sync
            if [ "$name" = 'Compare live preview rendering' ]; then context=ionos/visual-compare; fi
            state=pending
            if [ "$status" = completed ]; then
              if [ "$conclusion" = success ]; then state=success; else state=failure; fi
            fi
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$sha" -f state="$state" -f context="$context" -f description="Actual workflow status: $status / $conclusion" -f target_url="$url"
          done < runs.jsonl
