name: Record IONOS reference synchronization status
on:
  push:
    branches: [main]
    paths: ['.github/workflows/observe-ionos-reference.yml']
  workflow_run:
    workflows: ['Synchronize approved GitHub Pages reference to IONOS']
    types: [in_progress, completed]
permissions:
  actions: read
  statuses: write
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Record actual synchronization workflow state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            run=$(jq -er '.workflow_run.id' "$GITHUB_EVENT_PATH")
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" > run.json
          else
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/sync-pages-to-ionos.yml/runs?per_page=1" --jq '.workflow_runs[0]' > run.json
          fi
          jq '{id,head_sha,status,conclusion,html_url}' run.json
          sha=$(jq -er '.head_sha' run.json)
          url=$(jq -er '.html_url' run.json)
          status=$(jq -er '.status' run.json)
          conclusion=$(jq -r '.conclusion' run.json)
          state=pending
          description="Reference synchronization is running"
          if [ "$status" = completed ]; then
            if [ "$conclusion" = success ]; then
              state=success
              description="Approved reference uploaded and HTTPS verified"
            else
              state=failure
              description="Reference synchronization did not pass; inspect workflow"
            fi
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$sha" -f state="$state" -f context="ionos/reference-sync" -f description="$description" -f target_url="$url"
