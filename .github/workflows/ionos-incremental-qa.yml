name: Bootstrap incremental IONOS deployment
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ionos-incremental-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ionos-preview-deployment
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests and exact current build
        run: |
          python .github/scripts/test-incremental-ionos.py
          python -m py_compile .github/scripts/incremental-ionos.py .github/scripts/upload-ionos.py .github/scripts/clean-upload-ionos.py
          npm ci
          npm run verify
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python scripts/optimize-preview-images.py
          node .github/scripts/prepare-ionos.mjs
          node scripts/check-contact-cleanup.mjs
      - name: Install browser diagnostic
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check stable transition in isolated simulated browser at three widths
        run: node scripts/test-turnstile-transition.mjs
      - name: Install SFTP client
        run: |
          if ! /usr/bin/python3 -c 'import paramiko'; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends python3-paramiko
          fi
      - name: Apply only changed files after exact comparison
        env:
          CREAID_INCREMENTAL_MODE: apply
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: /usr/bin/python3 .github/scripts/upload-ionos.py
      - name: Repeat audit using new protected deployment state
        env:
          CREAID_INCREMENTAL_MODE: audit
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: /usr/bin/python3 .github/scripts/upload-ionos.py

# Repair Paramiko compatibility and deploy visible Turnstile challenge without a full upload.
      - name: Inspect real Cloudflare challenge without sending mail
        run: node scripts/diagnose-turnstile-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: turnstile-live-diagnostic
          path: turnstile-live.png
          if-no-files-found: ignore

# Use documented Cloudflare API onload callback; require a real widget iframe in browser QA.

# Collapse the challenge after success; restore it on expiry, failure and token reset.

# Stable 350ms transition: local UI simulation must pass before any website file upload.

# Contact contrast, phone, footer cleanup and delayed verified-button contraction.
