name: SEO phase 1 release QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - '.github/scripts/**'
      - '.github/workflows/seo-phase-1-qa.yml'
      - 'docs/seo/**'
      - 'docs/sitemap-kandidat-nach-freigabe.xml'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/optimize-preview-images.py
      - run: node .github/scripts/prepare-ionos.mjs
      - run: node .github/scripts/prepare-preview-cache.mjs
      - run: node .github/scripts/prepare-production-indexing.mjs
      - run: node scripts/check-production-seo.mjs
  live-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-production-seo.mjs --baseline
