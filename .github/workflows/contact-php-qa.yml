name: Contact PHP backend QA (no deployment)
on:
  push:
    branches: [optimization/contact-php-backend]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    strategy:
      matrix:
        php: ['8.4','8.5']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl
          tools: composer:v2
          coverage: none
      - name: Install pinned SMTP library and audit dependencies
        working-directory: backend/contact
        run: |
          composer install --no-dev --no-interaction --prefer-dist
          composer audit --no-interaction
      - name: Lint and test without sending emails
        run: |
          php -l backend/contact-public/contact.php
          php -l backend/contact/core.php
          php -l backend/contact/config.example.php
          php backend/contact/test.php
      - name: Package disabled private backend for manual IONOS installation
        if: matrix.php == '8.4'
        run: |
          set -euo pipefail
          mkdir -p /tmp/creaid-private
          cp backend/contact/core.php backend/contact/config.example.php /tmp/creaid-private/
          cp -R backend/contact/vendor /tmp/creaid-private/
          printf 'Require all denied\n' > /tmp/creaid-private/.htaccess
          (cd /tmp/creaid-private && zip -qr "$GITHUB_WORKSPACE/creaid-contact-private.zip" .)
          unzip -t creaid-contact-private.zip
          unzip -Z1 creaid-contact-private.zip | grep -Fx '.htaccess'
          unzip -Z1 creaid-contact-private.zip | grep -Fx 'vendor/autoload.php'
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.4'
        with:
          name: creaid-contact-private-install
          path: creaid-contact-private.zip
          if-no-files-found: error
          retention-days: 14
