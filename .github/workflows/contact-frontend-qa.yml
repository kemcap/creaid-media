name: Contact frontend QA
on:
  push:
    branches: ['optimization/contact-form-frontend']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check public/assets/agency-pages.js
      - run: npm run verify
      - name: Install isolated contact browser test
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise actual frontend with mocked endpoint
        run: |
          node scripts/preview.mjs > "$RUNNER_TEMP/contact-preview.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/check-contact-browser.mjs
