name: Contact frontend QA
on:
  push:
    branches: ['optimization/contact-form-frontend']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check public/assets/agency-pages.js
      - run: npm run verify
