name: Phase 0 live baseline inventory
on:
  push:
    branches: ['audit/editorial-ux-2026-11']
    paths: ['.github/workflows/phase-zero-baseline.yml','scripts/audit-phase-zero.mjs']
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record live baseline audit start
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context=audit/phase-zero -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -f description="Live inventory running"
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.56.1 lighthouse@12.8.2
      - run: npx playwright install --with-deps chromium
      - name: Read-only inventory of live preview on desktop and mobile
        run: node scripts/audit-phase-zero.mjs
      - name: Lighthouse baseline, home and journal, desktop and mobile
        run: |
          export CHROME_PATH=$(node --input-type=module -e 'import {chromium} from "playwright"; console.log(chromium.executablePath())')
          for entry in home journal; do
            url=https://vorschau.creaid-media.de/
            if [ "$entry" = journal ]; then url="${url}creaid-blog"; fi
            for device in desktop mobile; do
              args=()
              if [ "$device" = desktop ]; then args+=(--preset=desktop); fi
              npx --no-install lighthouse "$url" "${args[@]}" --quiet --chrome-flags="--headless --no-sandbox" --output=json --output-path="phase-zero-report/lighthouse-$entry-$device.json" || echo "Lighthouse failed for $entry $device"
            done
          done
          node --input-type=module -e 'import{readdirSync,readFileSync}from"node:fs"; for(const f of readdirSync("phase-zero-report").filter(n=>n.startsWith("lighthouse-"))){const j=JSON.parse(readFileSync("phase-zero-report/"+f));console.log(f,JSON.stringify(Object.fromEntries(Object.entries(j.categories||{}).map(([k,v])=>[k,v.score]))));}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-zero-live-baseline
          path: phase-zero-report/
          if-no-files-found: warn
      - name: Record actual audit result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          if [ "$JOB_STATUS" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=audit/phase-zero -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -f description="Live inventory job $JOB_STATUS"
