<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">KI-Workflow für kleine Unternehmen</title><desc id="desc">Eingang einer Kundenanfrage, strukturierte KI-Verarbeitung und menschliche Freigabe – dargestellt als drei verbundene Stationen.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#19191c"/><stop offset="1" stop-color="#390d21"/></linearGradient><linearGradient id="pink" x1="0" x2="1"><stop stop-color="#fa225b"/><stop offset="1" stop-color="#b3284f"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity=".28"/></filter></defs><rect width="1200" height="720" fill="url(#bg)"/><g stroke="#eee" stroke-opacity=".09"><path d="M0 120H1200M0 240H1200M0 360H1200M0 480H1200M0 600H1200"/><path d="M100 0V720M300 0V720M500 0V720M700 0V720M900 0V720M1100 0V720"/></g><text x="70" y="95" font-family="Arial,Helvetica,sans-serif" font-weight="800" fill="#fa225b" font-size="21" letter-spacing="5">CREAID / SMART WORKFLOWS</text><text x="70" y="156" font-family="Arial,Helvetica,sans-serif" font-weight="800" fill="#faf8f8" font-size="43" letter-spacing="-2">WENIGER ROUTINE. MEHR FREIRAUM.</text><g fill="none" stroke="#fa225b" stroke-width="7"><path d="M334 408H450"/><path d="M418 389L449 408L418 427"/><path d="M748 408H864"/><path d="M832 389L863 408L832 427"/></g><g filter="url(#sh)"><rect x="70" y="282" width="265" height="252" rx="11" fill="#f4f2ee"/><rect x="450" y="282" width="299" height="252" rx="11" fill="#f4f2ee"/><rect x="865" y="282" width="265" height="252" rx="11" fill="#f4f2ee"/></g><g font-family="Arial,Helvetica,sans-serif"><text x="100" y="335" font-size="18" letter-spacing="2" font-weight="700" fill="#ad2b54">01 / EINGANG</text><text x="100" y="390" font-size="30" font-weight="800" fill="#242226">ANFRAGE</text><text x="100" y="427" font-size="16" fill="#665f64">Formular, E-Mail</text><text x="100" y="451" font-size="16" fill="#665f64">oder CRM-Eintrag</text><text x="482" y="335" font-size="18" letter-spacing="2" font-weight="700" fill="#ad2b54">02 / VERARBEITUNG</text><text x="482" y="390" font-size="30" font-weight="800" fill="#242226">KI-WORKFLOW</text><text x="482" y="427" font-size="16" fill="#665f64">Sortieren und</text><text x="482" y="451" font-size="16" fill="#665f64">Entwurf vorbereiten</text><text x="895" y="335" font-size="18" letter-spacing="2" font-weight="700" fill="#ad2b54">03 / FREIGABE</text><text x="895" y="390" font-size="30" font-weight="800" fill="#242226">MENSCH</text><text x="895" y="427" font-size="16" fill="#665f64">Prüfen und</text><text x="895" y="451" font-size="16" fill="#665f64">gezielt versenden</text></g><text x="70" y="635" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#bcb1b8" letter-spacing="1.5">BEISPIELPROZESS · SCHEMATISCHE DARSTELLUNG</text><path d="M1090 100h30m-15-15v30" stroke="#fa225b" stroke-width="4"/></svg>
